<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Admin - Pembuatan Akun User Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">
  <nav class="bg-rose-700 text-white px-6 py-4 flex justify-between items-center shadow">
    <h1 class="font-bold text-lg">Admin Stroberi — Manajemen Akun Mobile</h1>
    <div class="space-x-3 text-sm font-medium">
      <a href="/" class="underline">Buat Akun User</a>
      <a href="/roi-lab" class="bg-white text-rose-700 px-3 py-1.5 rounded hover:bg-rose-50">Lab Proses ROI &rarr;</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Form Buat Akun User Flutter -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h2 class="font-semibold text-base mb-1">Daftarkan Akun User</h2>
      <p class="text-xs text-slate-500 mb-4">Akun langsung berstatus terverifikasi untuk login di aplikasi Flutter.</p>

      <form id="userForm" class="space-y-3">
        <div>
          <label class="block text-xs font-medium mb-1">Nama Lengkap</label>
          <input type="text" id="nama" required class="w-full border rounded-lg px-3 py-2 text-sm"
            placeholder="Contoh: Budi Santoso" />
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">Email</label>
          <input type="email" id="email" required class="w-full border rounded-lg px-3 py-2 text-sm"
            placeholder="budi@email.com" />
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">Nomor HP / WhatsApp</label>
          <input type="text" id="phone" required class="w-full border rounded-lg px-3 py-2 text-sm"
            placeholder="081234567890" />
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">Password</label>
          <input type="password" id="password" required class="w-full border rounded-lg px-3 py-2 text-sm"
            placeholder="Min. 8 karakter (huruf & angka)" />
        </div>
        <button type="submit"
          class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 rounded-lg text-sm">
          + Buat Akun User
        </button>
      </form>
      <p id="statusMsg" class="text-xs mt-3 font-medium"></p>
    </section>

    <!-- Daftar Akun Terdaftar -->
    <section class="md:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold text-base">Daftar Akun User Terdaftar</h2>
        <button onclick="loadUsers()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded">Muat
          Ulang</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="border-b bg-slate-50 text-slate-600 text-xs uppercase">
              <th class="py-2 px-3">ID</th>
              <th class="py-2 px-3">Nama</th>
              <th class="py-2 px-3">Email</th>
              <th class="py-2 px-3">No. HP</th>
              <th class="py-2 px-3">Status</th>
              <th class="py-2 px-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="usersTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    async function loadUsers() {
      const res = await fetch("/api/web/users");
      const json = await res.json();
      const tbody = document.getElementById("usersTableBody");
      tbody.innerHTML = "";
      if (!json.users || json.users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-xs text-slate-400">Belum ada akun terdaftar.</td></tr>`;
        return;
      }

      json.users.forEach(u => {
        const badge = u.is_verified
          ? `<span class="px-2 py-0.5 text-xs rounded bg-emerald-100 text-emerald-700">Aktif</span>`
          : `<span class="px-2 py-0.5 text-xs rounded bg-amber-100 text-amber-700">Belum OTP</span>`;

        tbody.innerHTML += `
          <tr>
            <td class="py-2 px-3">${u.id}</td>
            <td class="py-2 px-3 font-medium">${u.nama}</td>
            <td class="py-2 px-3 text-slate-600">${u.email}</td>
            <td class="py-2 px-3 text-slate-600">${u.phone}</td>
            <td class="py-2 px-3">${badge}</td>
            <td class="py-2 px-3 text-right">
              <button onclick="deleteUser(${u.id})" class="text-xs text-red-600 hover:underline">Hapus</button>
            </td>
          </tr>`;
      });
    }

    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("statusMsg");
      const res = await fetch("/api/web/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nama: document.getElementById("nama").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          password: document.getElementById("password").value,
        }),
      });
      const json = await res.json();
      if (res.ok) {
        msg.className = "text-xs mt-3 font-medium text-emerald-600";
        msg.textContent = json.message;
        e.target.reset();
        loadUsers();
      } else {
        msg.className = "text-xs mt-3 font-medium text-red-600";
        msg.textContent = json.error || "Gagal membuat akun.";
      }
    });

    async function deleteUser(id) {
      if (!confirm("Hapus akun ini?")) return;
      await fetch(`/api/web/users/${id}`, { method: "DELETE" });
      loadUsers();
    }

    loadUsers();
  </script>
</body>

</html>
