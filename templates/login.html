<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Strawberry Care Greenhouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-page: #f2f6f3;
            --bg-card: #ffffff;
            --green-dark: #1b4332;
            --green-primary: #2d6a4f;
            --green-hover: #245740;
            --green-soft: #e8f3ed;
            --berry-accent: #d93848;
            --text-main: #18261f;
            --text-muted: #5c7066;
            --border-color: #d6e2dc;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-page);
            background-image:
                radial-gradient(circle at 12% 18%, rgba(45, 106, 79, 0.10) 0%, transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(217, 56, 72, 0.07) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 45px -15px rgba(27, 67, 50, 0.12);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--green-soft);
            color: var(--green-primary);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--green-primary);
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.2);
        }

        .logo-box {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--green-dark), var(--green-primary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 10px 20px -8px rgba(45, 106, 79, 0.5);
        }

        .brand-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--green-dark);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .alert-error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            font-size: 13px;
            font-weight: 500;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
        }

        .input-box input {
            width: 100%;
            height: 46px;
            padding: 0 42px 0 42px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fafcfb;
            transition: all 0.2s ease;
        }

        .input-box input::placeholder {
            color: #96a89f;
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--green-primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.12);
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            border-radius: 6px;
        }

        .toggle-pw:hover {
            color: var(--green-dark);
            background: var(--green-soft);
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            margin-top: 6px;
            border: none;
            border-radius: 12px;
            background: var(--green-primary);
            color: #ffffff;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: var(--green-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .card-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #ebf1ee;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-footer span {
            color: var(--berry-accent);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-badge">
                    <span class="status-dot"></span>
                    Smart Greenhouse System
                </div>
                <div class="logo-box" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
                        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
                    </svg>
                </div>
                <h1>Strawberry Care</h1>
                <p>Masuk sebagai Administrator untuk memantau sensor greenhouse, kamera AI, dan manajemen akun.</p>
            </div>

            {% if error %}
            <div class="alert-error" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login" id="loginForm">
                <div class="form-group">
                    <label for="username">Username Admin</label>
                    <div class="input-box">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" placeholder="Masukkan username admin"
                            value="{{ username or '' }}" autocomplete="username" required autofocus />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-box">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" placeholder="Masukkan password"
                            autocomplete="current-password" required />
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan password">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span>Masuk ke Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>
            </form>

            <div class="card-footer">
                Akses terbatas khusus <span>Administrator Sistem</span> • ESP32 &amp; MobileNetV2
            </div>
        </div>
    </div>

    <script>
        const pwInput = document.getElementById("password");
        const toggleBtn = document.getElementById("togglePw");
        const eyeIcon = document.getElementById("eyeIcon");
        const loginForm = document.getElementById("loginForm");
        const submitBtn = document.getElementById("submitBtn");

        toggleBtn.addEventListener("click", () => {
            const isHidden = pwInput.type === "password";
            pwInput.type = isHidden ? "text" : "password";
            eyeIcon.innerHTML = isHidden
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });

        loginForm.addEventListener("submit", () => {
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.85";
            submitBtn.querySelector("span").textContent = "Memverifikasi...";
        });
    </script>
</body>

</html>
