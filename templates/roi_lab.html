<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Proses ROI & Kematangan Stroberi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">
    <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
        <h1 class="font-bold text-lg">Lab Proses ROI & Klasifikasi Kematangan Buah</h1>
        <a href="/" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded">&larr; Kembali ke Buat Akun
            User</a>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-6">
        <section
            class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                <input type="file" id="imageInput" accept="image/*"
                    class="text-sm border rounded-lg p-1.5 bg-slate-50" />
                <button onclick="runRoi('upload')"
                    class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    Proses ROI (Upload Gambar)
                </button>
            </div>
            <button onclick="runRoi('latest_esp32')"
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium w-full md:w-auto">
                Proses dari Foto ESP32 Terakhir
            </button>
        </section>

        <section id="resultBox" class="hidden space-y-6">
            <div
                class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">
                <div>
                    <span class="text-slate-500 block text-xs">Metode ROI</span>
                    <strong id="resMethod" class="text-base">-</strong>
                </div>
                <div>
                    <span class="text-slate-500 block text-xs">Luas Kontur Merah</span>
                    <strong id="resArea" class="text-base">-</strong>
                </div>
                <div>
                    <span class="text-slate-500 block text-xs">Hasil Kematangan</span>
                    <strong id="resClass" class="text-lg text-rose-600 uppercase">-</strong>
                </div>
                <div>
                    <span class="text-slate-500 block text-xs">Confidence</span>
                    <strong id="resConf" class="text-lg text-emerald-600">-</strong>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-3 rounded-xl shadow-sm border">
                    <p class="text-xs font-semibold mb-2 text-slate-600">1. Gambar Asli</p>
                    <img id="imgOrig" class="w-full h-56 object-contain bg-slate-900 rounded" />
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border">
                    <p class="text-xs font-semibold mb-2 text-slate-600">2. Mask HSV + Morfologi</p>
                    <img id="imgMask" class="w-full h-56 object-contain bg-slate-900 rounded" />
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border">
                    <p class="text-xs font-semibold mb-2 text-slate-600">3. Bounding Box (Kuning: Awal, Hijau: ROI)</p>
                    <img id="imgBbox" class="w-full h-56 object-contain bg-slate-900 rounded" />
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border">
                    <p class="text-xs font-semibold mb-2 text-slate-600">4. Hasil Crop ROI (Input Model)</p>
                    <img id="imgCrop" class="w-full h-56 object-contain bg-slate-900 rounded" />
                </div>
            </div>
        </section>
    </main>

    <script>
        async function runRoi(mode) {
            const formData = new FormData();
            if (mode === "upload") {
                const fileInput = document.getElementById("imageInput");
                if (!fileInput.files.length) return alert("Pilih gambar terlebih dahulu.");
                formData.append("file", fileInput.files[0]);
            } else {
                formData.append("source", "latest_esp32");
            }

            const res = await fetch("/api/roi/process", { method: "POST", body: formData });
            const json = await res.json();
            if (!res.ok) return alert(json.error || "Gagal memproses ROI.");

            const d = json.data;
            document.getElementById("resultBox").classList.remove("hidden");
            document.getElementById("resMethod").textContent = d.method;
            document.getElementById("resArea").textContent = d.contour_area + " px";
            document.getElementById("resClass").textContent = d.kelas;
            document.getElementById("resConf").textContent = d.confidence_percent + "%";

            document.getElementById("imgOrig").src = d.images.original;
            document.getElementById("imgMask").src = d.images.mask;
            document.getElementById("imgBbox").src = d.images.bbox;
            document.getElementById("imgCrop").src = d.images.crop;
        }
    </script>
</body>

</html>
